name: Voiceover (TTS)
on:
  push:
    branches: [claude/project-thread-va51fi]
    paths: ['voiceover/*.txt', '.github/workflows/voiceover.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --upgrade edge-tts && pip show edge-tts | head -2
      - name: Generate audio
        run: |
          set +e
          tts() { for k in 1 2 3 4 5 6; do r="$2"; [ $k -gt 2 ] && r=+$((k-2))%; edge-tts --voice "$1" --rate="$r" -f "$3" --write-media "$4" && [ -s "$4" ] && return 0; echo "retry $k: $3"; rm -f "$4"; sleep $((k*5)); done; echo "FAILED: $3"; }
          for f in voiceover/*.txt; do
            n=$(basename "$f" .txt)
            case "$n" in
              *-ru-*) [ -s "voiceover/$n.mp3" ] || tts ru-RU-DmitryNeural +5% "$f" "voiceover/$n.mp3" ;;
              *-kk-*) [ -s "voiceover/$n.mp3" ] || tts kk-KZ-DauletNeural +8% "$f" "voiceover/$n.mp3" ;;
            esac
          done
          ls -la voiceover
      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voiceover/*.mp3
          git commit -m "Generate voiceover audio [skip ci]" || echo "nothing to commit"
          git push
