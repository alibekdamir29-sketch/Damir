# Local/VPS deployment: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: damir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: damir
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U damir"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://damir:${POSTGRES_PASSWORD}@db:5432/damir?schema=public
    ports: ["3000:3000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
  uploads:
