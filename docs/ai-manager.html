<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAMIR AI-менеджер</title>
<meta name="description" content="Instagram мен WhatsApp-та клиенттерге 24/7 қазақша және орысша жауап беретін AI-менеджер демосы">
<style>
:root{
  --ink:#111;--muted:#6b6b6b;--line:#e7e7e7;--bg:#fafafa;--card:#fff;--accent:#111;
  --ig-user:#3797f0;--ig-bot:#efefef;--ig-bg:#fff;
  --wa-head:#008069;--wa-bg:#efeae2;--wa-user:#d9fdd3;--wa-bot:#fff;
  --chat-text:#111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f2f2f2;--muted:#a3a3a3;--line:#2a2a2a;--bg:#0e0e0e;--card:#171717;--accent:#f2f2f2;
    --ig-bot:#262626;--ig-bg:#000;--wa-bg:#0b141a;--wa-user:#005c4b;--wa-bot:#202c33;--wa-head:#1f2c34;--chat-text:#e9edef;
  }
}
:root[data-theme="dark"]{
  --ink:#f2f2f2;--muted:#a3a3a3;--line:#2a2a2a;--bg:#0e0e0e;--card:#171717;--accent:#f2f2f2;
  --ig-bot:#262626;--ig-bg:#000;--wa-bg:#0b141a;--wa-user:#005c4b;--wa-bot:#202c33;--wa-head:#1f2c34;--chat-text:#e9edef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{font-weight:800;letter-spacing:.22em;font-size:15px;text-decoration:none}
.logo small{font-weight:600;letter-spacing:.08em;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 12px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.seg button.on{background:var(--accent);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr;gap:28px;padding:8px 0 40px}
@media(min-width:900px){.grid{grid-template-columns:1fr 400px;align-items:start;padding-top:28px}}
.hero h1{font-size:clamp(26px,6vw,44px);line-height:1.08;margin:6px 0 12px;letter-spacing:-.02em}
.hero p{color:var(--muted);margin:0 0 18px;font-size:16px;max-width:520px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.try{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px}
.try h3{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.try ul{margin:0;padding-left:18px;color:var(--muted)}
.hide-m{display:none}
@media(min-width:900px){.hide-m{display:block}}

/* phone */
.phone{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;height:min(720px,calc(100svh - 120px));min-height:520px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
@media(min-width:900px){.phone{border:10px solid #111;border-radius:42px;height:760px;position:sticky;top:20px}}
.ch-tabs{display:flex;gap:6px;justify-content:center;padding:10px;border-bottom:1px solid var(--line);background:var(--card)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.08em;color:#fff;background:#111;flex:none}
.ig .ava{background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2);padding:2px}
.ig .ava i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#111;font-style:normal}
.chead .n{font-weight:700;font-size:14px}
.chead .s{font-size:12px;color:var(--muted)}
.wa .chead{background:var(--wa-head);color:#fff;border-bottom:0}
.wa .chead .s{color:rgba(255,255,255,.8)}
.badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:999px;background:#e8f5e9;color:#1b5e20}
.wa .badge{background:rgba(255,255,255,.18);color:#fff}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:var(--ig-bg);color:var(--chat-text);scroll-behavior:smooth}
.wa .msgs{background:var(--wa-bg)}
.day{align-self:center;font-size:11px;color:var(--muted);margin:4px 0 8px}
.wa .day{background:var(--wa-bot);padding:4px 10px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.b{max-width:82%;padding:9px 12px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.b.u{align-self:flex-end;background:var(--ig-user);color:#fff}
.b.a{align-self:flex-start;background:var(--ig-bot)}
.wa .b{border-radius:10px;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.wa .b.u{background:var(--wa-user);color:var(--chat-text)}
.wa .b.a{background:var(--wa-bot)}
.b .t{display:block;text-align:right;font-size:10px;opacity:.55;margin-top:2px}
.ig .b .t{display:none}
.cards{align-self:flex-start;display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 2px 6px;scrollbar-width:none}
.card{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:var(--ink)}
.card img{display:block;width:100%;height:150px;object-fit:cover;background:#eee}
.card .ci{padding:8px 10px 10px}
.card .cn{font-weight:700;font-size:13px}
.card .cp{font-size:13px;margin:2px 0}
.card .cs{font-size:11px;color:var(--muted)}
.card button{margin-top:8px;width:100%;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:600 12px inherit;font-family:inherit;padding:8px;cursor:pointer}
.typing{align-self:flex-start;background:var(--ig-bot);border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.wa .typing{background:var(--wa-bot);border-radius:10px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line);background:var(--card);scrollbar-width:none}
.chips::-webkit-scrollbar,.cards::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.play{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
form.in{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card)}
form.in input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:11px 14px;font:16px inherit;font-family:inherit;outline:none}
form.in button{border:0;border-radius:999px;background:var(--accent);color:var(--bg);font:700 14px inherit;font-family:inherit;padding:0 16px;cursor:pointer}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200%);visibility:hidden;transition:transform .35s ease,visibility .35s;z-index:50;width:min(92vw,380px);background:rgba(30,30,30,.96);color:#fff;border-radius:16px;padding:12px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast b{display:block;font-size:12px;letter-spacing:.06em;opacity:.7;margin-bottom:2px}

section.info{padding:8px 0 48px;border-top:1px solid var(--line)}
section.info h2{font-size:24px;letter-spacing:-.01em;margin:28px 0 14px}
.steps{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.step b{display:block;margin-bottom:4px}
.step span{color:var(--muted);font-size:14px}
.step em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.cmp{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cmp tr:last-child td{border-bottom:0}
.foot{color:var(--muted);font-size:12px;padding:20px 0 40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="logo" href="index.html">DAMIR<small>AI</small></a>
    <div class="seg" id="lang">
      <button data-l="kk" class="on">ҚАЗ</button><button data-l="ru">РУС</button>
    </div>
  </div>

  <div class="grid">
    <div class="hero">
      <span class="pill" data-i="pill"></span>

      <div class="try hide-m">

    <div class="phone ig" id="phone">
      <div class="ch-tabs">
        <div class="seg" id="chan"><button data-c="ig" class="on">Instagram</button><button data-c="wa">WhatsApp</button></div>
      </div>
      <div class="chead">
        <div class="ava"><i>D</i></div>
        <div><div class="n" id="hname">damir.store</div><div class="s" data-i="online"></div></div>
        <span class="badge">AI 24/7</span>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="chips"></div>
      <form class="in" id="form" autocomplete="off">
        <input id="inp" data-ph="ph" enterkeyhint="send">
        <button type="submit" aria-label="send">➤</button>
      </form>
    </div>
  </div>

  <section class="info">
    <h2 data-i="howH"></h2>
    <div class="steps" id="steps"></div>
    <h2 data-i="cmpH"></h2>
    <table class="cmp" id="cmp"></table>
    <div class="foot" data-i="foot"></div>
  </section>
</div>

<div class="toast" id="toast"><b data-i="toastH"></b><span id="toastT"></span></div>

function detectLang(s){
  if(/[әғқңөұүһі]/i.test(s)) return 'kk';
  const l=s.toLowerCase();
  if(['салем','рахмет','бар ма','канша','алам','керек','жеткизу','кайда'].some(k=>l.includes(k))) return 'kk';
  if(/[а-яё]/i.test(s)) return 'ru';
  return lang;
}
function findProduct(s){return P.find(p=>p.kw.some(k=>s.includes(k)))}
function sizeFrom(s){
  const m=s.match(/\b(xxs|xs|s|m|l|xl|xxl|2[6-9]|3[0-9]|4[0-5])\b/i);
  return m?m[1].toUpperCase():null;
}
function recSize(s){
  const nums=(s.match(/\d{2,3}/g)||[]).map(Number);
  const h=nums.find(n=>n>=140&&n<=210), w=nums.find(n=>n>=35&&n<=150);
  if(!h&&!w) return null;
  const score=(h||170)*0.5+(w||65);
  return score<135?'XS':score<147?'S':score<158?'M':score<170?'L':'XL';
}
const has=(s,arr)=>arr.some(k=>s.includes(k));

function reply(raw){
  const s=raw.toLowerCase();
  const L=detectLang(raw);
  const r=R[L];
  const out=[];
  const prod=findProduct(s);
  if(prod) st.product=prod;

  // order flow
  if(st.step==='size'){
    const sz=sizeFrom(s)||recSize(s);
    if(sz){st.size=sz;st.step='name';return [{t:r.orderName}]}
  }
  if(st.step==='name' && /\d{3}/.test(s)){
    const nm=raw.split(/[,\d+]/)[0].trim()||'—';
    orderNo++;st.step=null;
    const p=st.product||P[0];
    setTimeout(()=>toast(r.toast(orderNo,p,st.size,nm)),900);
    return [{t:r.orderDone(orderNo,p,st.size,nm)}];
  }
  if(has(s,['алам','аламын','беру','тапсырыс','заказ','беру','возьму','беру!','беру ','хочу купить','оформ','купить','брать'])){
    if(!st.product) return [{t:r.whichProduct},{cards:P.slice(0,4)}];
    st.step='size';return [{t:r.orderSize(st.product)}];
  }
  // size advice
  if(has(s,['размер','өлшем','бойым','рост','салмағ','вес ']) || /\d{2,3}\s*(см|кг)/.test(s)){
    const rec=recSize(s);
    if(rec){ if(st.product) st.step='size'; return [{t:r.sizeRec(rec)}]; }
    return [{t:r.sizeAsk}];
  }
  if(has(s,['қанша','канша','баға','бага','сколько','цена','стоит','стоимост','почём','прайс'])){
    if(st.product) return [{t:r.price(st.product)}];
    return [{t:r.all},{cards:P}];
  }
  if(has(s,['жеткіз','жеткиз','доставк','курьер','пошта','почт','cdek','сдэк'])) return [{t:r.delivery}];
  if(has(s,['kaspi','каспи','төле','толе','оплат','карт','наличн','рассроч','бөліп'])) return [{t:r.pay}];
  if(has(s,['мекенжай','адрес','қайда','кайда','где','график','уақыт','режим','часы работы','мекен'])) return [{t:r.addr}];
  if(has(s,['қайтар','кайтар','ауыстыр','возврат','вернуть','обмен'])) return [{t:r.ret}];
  if(has(s,['скидк','жеңілдік','женилдик','акци','промо','sale'])) return [{t:r.sale}];
  if(has(s,['менеджер','оператор','адаммен','человек','живой'])) return [{t:r.human}];
  if(has(s,['рахмет','рақмет','спасибо','благодар','рахмет'])) return [{t:r.thanks}];
  if(prod) return [{t:r.avail(prod)},{cards:[prod]}];
  if(has(s,['не бар','что есть','каталог','ассортимент','покаж','көрсет','что у вас','тауар'])) return [{t:r.all},{cards:P}];
  if(has(s,['сәлем','салем','привет','здравств','добр','қайырлы','ассалау','hello','hi'])) return [{t:r.hi},{cards:P.slice(0,4)}];
  return [{t:r.fallback}];
}

async function send(text){
  if(!text.trim()||busy) return;
  busy=true;
  bubble(text,'u');
  await wait(350);typing(true);
  const parts=reply(text);
  await wait(700+Math.min(900,text.length*15));
  typing(false);
  for(const p of parts){
    if(p.t) bubble(p.t,'a');
    if(p.cards){await wait(250);cards(p.cards,detectLang(text))}
    await wait(200);
  }
  busy=false;
}

async function play(){
  if(playing){playing=false;renderChips();return}
  reset();playing=true;renderChips();
  for(const line of SCRIPT[lang]){
    if(!playing) break;
    await wait(900);
    // typewriter in input for realism
    const inp=$('#inp');inp.value='';
    for(const ch of line){if(!playing)break;inp.value+=ch;await wait(28)}
    inp.value='';
    await send(line);
    await wait(1400);
  }
  playing=false;renderChips();
}
function reset(){
  msgs.innerHTML=`<div class="day">${lang==='kk'?'Бүгін':'Сегодня'}</div>`;
  st={product:null,step:null,size:null};
}

$('#form').addEventListener('submit',e=>{e.preventDefault();const v=$('#inp').value;$('#inp').value='';send(v)});
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='play') return play();
  if(b.dataset.act==='reset'){playing=false;reset();renderChips();return}
  if(!playing) send(b.textContent);
});
msgs.addEventListener('click',e=>{
  const b=e.target.closest('[data-buy]');if(!b||playing)return;
  const p=P.find(x=>x.id===b.dataset.buy);st.product=p;
  send(lang==='kk'?`${p.n.kk} алам`:`Оформить: ${p.n.ru}`);
});
$('#lang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;playing=false;applyLang();reset()});
$('#chan').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;chan=b.dataset.c;
  $('#phone').className='phone '+chan;
  $('#hname').textContent=chan==='ig'?'damir.store':'DAMIR Store';
  document.querySelectorAll('#chan button').forEach(x=>x.classList.toggle('on',x===b));
});
try{const q=new URLSearchParams(location.search);if(q.get('lang')==='ru')lang='ru';if(q.get('ch')==='wa')$('#chan [data-c=wa]').click()}catch(e){}
applyLang();reset();
setTimeout(()=>{bubble(R[lang].hi,'a');cards(P.slice(0,4),lang)},400);
</script>
